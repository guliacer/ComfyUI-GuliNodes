[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-gulinodes"
version = "1.0.13"
description = "GuliNodes - 工具栏 + 图像处理 + 潜空间尺寸 + 模型/LoRA + 工作流 + 文本 + 采样 + 视频"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Guli" }
]
keywords = [
  "comfyui",
  "custom-nodes",
  "image-processing",
  "text-utils",
  "lora",
  "workflow-tools"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/guliacer/ComfyUI-GuliNodes"
Repository = "https://github.com/guliacer/ComfyUI-GuliNodes"
Issues = "https://github.com/guliacer/ComfyUI-GuliNodes/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["guli_nodes*"]

[tool.comfy]
PublisherId = "guliacer"
DisplayName = "ComfyUI-GuliNodes"
Icon = ""

[tool.gulinodes]
name = "ComfyUI-GuliNodes"
node_count = 41
python_package = "guli_nodes"
web_directory = "web"
summary = "Custom nodes for image tools, video compression, text processing, LoRA helpers, workflow helpers, and Z-Image sampling."
